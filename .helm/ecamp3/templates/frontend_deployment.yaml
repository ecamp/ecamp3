apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frontend.name" . }}
  labels:
    {{- include "frontend.selectorLabels" . | nindent 4 }}
    {{- include "app.commonLabels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frontend.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      enableServiceLinks: false
      initContainers:
        - name: {{ .Chart.Name }}-template-index-html
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Values.imageTag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              DIGEST=$(sha256sum /app/environment.js | cut -d ' ' -f 1)
              sed "s|<script src=\"/environment.js\"|<script src=\"/environment.js?version=$DIGEST\"|" /app/index.html > /app-target/index.html
              chmod -w /app-target/index.html

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /app-target
              name: app
            - mountPath: /app/environment.js
              name: environment-js
              subPath: environment.js
      containers:
        - name: {{ .Chart.Name }}-frontend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Values.imageTag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: frontend-http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              scheme: HTTP
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          # no livenessProbe is needed for an nginx static file server, see
          # https://developers.redhat.com/blog/2020/11/10/you-probably-need-liveness-and-readiness-probes
          # livenessProbe:
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /app/index.html
              name: app
              subPath: index.html
            - mountPath: /app/environment.js
              name: environment-js
              subPath: environment.js
      volumes:
        - name: environment-js
          configMap:
            name: {{ include "frontend.name" . }}-configmap
        - name: app
          emptyDir: {}
