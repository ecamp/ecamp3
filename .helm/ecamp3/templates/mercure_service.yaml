{{- if .Values.mercure.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mercure.name" . }}
  labels:
    {{- include "mercure.selectorLabels" . | nindent 4 }}
    {{- include "app.commonLabels" . | nindent 4 }}
spec:
  type: {{ .Values.mercure.service.type }}
  ports:
    - port: {{ .Values.mercure.service.port }}
      targetPort: mercure-http
      protocol: TCP
      name: mercure-http
  selector:
    {{- include "mercure.selectorLabels" . | nindent 4 }}
{{- end }}
