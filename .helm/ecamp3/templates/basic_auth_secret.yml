{{- if .Values.gateway.basicAuth.enabled -}}
{{- $basicAuth := .Values.gateway.basicAuth -}}
{{- $username := $basicAuth.username | required ".Values.gateway.basicAuth.username is required if .Values.gateway.basicAuth.enabled is true" -}}
{{- $password := $basicAuth.password | required ".Values.gateway.basicAuth.password is required if .Values.gateway.basicAuth.enabled is true" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.basicAuth.secret.name" . | quote }}
type: Opaque
data:
  auth: {{ htpasswd $username $password | b64enc | quote }}
{{- end }}
