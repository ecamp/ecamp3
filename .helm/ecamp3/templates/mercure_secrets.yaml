{{- if .Values.mercure.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mercure.name" . }}
  labels:
    {{- include "mercure.selectorLabels" . | nindent 4 }}
    {{- include "app.commonLabels" . | nindent 4 }}
type: Opaque
data:
  jwt-public-key: {{ .Values.api.jwt.publicKey | default "" | b64enc | quote }}
{{- end }}
