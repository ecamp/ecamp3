{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "print.name" . }}
  labels:
    {{- include "print.selectorLabels" . | nindent 4 }}
    {{- include "app.commonLabels" . | nindent 4 }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: api-gateway
  hostnames:
    - {{ .Values.domain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.print.subpath }}
      filters:
        {{- if and .Values.gateway.basicAuth.enabled (.Values.gateway.className | contains "traefik") }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ printf "%s-basic-auth" (include "app.name" .) | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "print.name" . }}
          port: {{ .Values.print.service.port }}
      timeouts:
        {{- if .Values.print.gateway.readTimeoutSeconds }}
        backendRequest: "{{ .Values.print.gateway.readTimeoutSeconds }}s"
        {{- end }}
{{- end }}
