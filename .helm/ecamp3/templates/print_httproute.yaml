{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "print.name" . }}
  labels:
    {{- include "print.selectorLabels" . | nindent 4 }}
    {{- include "app.commonLabels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.basicAuth.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-basic-auth@kubernetescrd" .Release.Namespace (include "app.name" .) | quote }}
    {{- end }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: api-gateway
  hostnames:
    - {{ .Values.domain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.print.subpath }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "print.name" . }}
          port: {{ .Values.print.service.port }}
      timeouts:
        {{- if .Values.print.ingress.readTimeoutSeconds }}
        backendRequest: "{{ .Values.print.ingress.readTimeoutSeconds }}s"
        {{- end }}
{{- end }}
