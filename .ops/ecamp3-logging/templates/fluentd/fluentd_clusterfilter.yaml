# from: https://stackoverflow.com/questions/41991128/parsing-inner-json-inside-fluentd
apiVersion: fluentd.fluent.io/v1alpha1
kind: ClusterFilter
metadata:
  name: cluster-filters
  labels:
    filter.fluentd.fluent.io/enabled: "true"
    {{- include "app.commonLabels" . | nindent 4 }}
    {{- include "app.commonSelectorLabels" . | nindent 4 }}
spec:
  filters:
    - customPlugin:
        config: |
          <filter **>
            @type record_transformer
            enable_ruby
            <record>
              log ${record['log'].gsub(/^.*std(out|err) F {/, "{")}
            </record>
          </filter>
          <filter **>
            @type parser
            key_name log
            reserve_data true
            remove_key_name_field false
            hash_value_field json
            time_key StartUTC
            time_format %Y-%m-%dT%H:%M:%S.%L%z
            <parse>
              @type multi_format
              <pattern>
                format json
                time_key StartUTC
                time_format %Y-%m-%dT%H:%M:%S.%L%z
              </pattern>
              <pattern>
                format none
              </pattern>
            </parse>
          </filter>
          <filter **>
            @type record_transformer
            enable_ruby
            <record>
              method ${if record['json'] && record['json']['RequestMethod']; then record['json']['RequestMethod']; else nil; end}
              path ${if record['json'] && record['json']['RequestPath']; then record['json']['RequestPath']; else nil; end}
              status ${if record['json'] && record['json']['OriginStatus']; then record['json']['OriginStatus']; else nil; end}
              duration ${if record['json'] && record['json']['OriginDuration']; then record['json']['OriginDuration']; else nil; end}
            </record>
          </filter>
          <filter **>
            @type record_transformer
            enable_ruby
            <record>
              escapedUrl ${if record['path']; then record['path'].gsub(/\/[0-9a-f]{6,}\/?/, "/{id}/").gsub(/%2F[0-9a-f]{6,}(%2F)?/, "%2F{id}%2F"); else nil; end}
            </record>
          </filter>
          <filter **>
            @type record_transformer
            enable_ruby
            <record>
              escapedUrlWithoutQuery ${if record['escapedUrl']; then record['escapedUrl'].gsub(/\?.*$/, ""); else nil; end}
            </record>
          </filter>
