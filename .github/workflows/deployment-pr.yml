name: CD for feature branches

on:
  pull_request_target:
    types: [opened, reopened, labeled, synchronize]
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action'
        type: choice
        required: true
        default: diff
        options:
          - diff
          - deploy

concurrency:
  group: ${{ github.workflow}}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-write-access:
    name: Check write access permission
    # Same condition as build-and-push, so pull requests that would not be
    # deployed anyway do not get a red check.
    if: (github.event_name == 'workflow_dispatch') || (contains(github.event.pull_request.labels.*.name, 'deploy!') && github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    steps:
      - name: Check if user has write access to this repository
        uses: actions/github-script@v9
        with:
          script: |
            // This workflow runs on pull_request_target, so the only trusted input
            // is the author of the pull request. A manual run is done by a
            // collaborator anyway, and context.actor is who triggered it.
            const login = context.payload.pull_request?.user.login ?? context.actor;

            let permission;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: login,
              });
              permission = data.permission;
            } catch (error) {
              // 404 for an unknown login, 401/403 for a token problem. Deny.
              permission = `unreadable (${error.status})`;
            }

            // The permission field is the base role of the repository: maintain
            // maps to write, triage maps to read, everything else denies.
            const allowed = ['write', 'admin'].includes(permission);
            core.info(
              `${login} has "${permission}" on ${context.repo.owner}/${context.repo.repo}: ${allowed ? 'allow' : 'deny'}`
            );

            if (!allowed) {
              core.setFailed(
                `User ${login} does not have write access to ${context.repo.owner}/${context.repo.repo}. Required permission: write or admin.`
              );
            }

  build-and-push:
    needs: check-write-access
    if: (github.event_name == 'workflow_dispatch') || (contains(github.event.pull_request.labels.*.name, 'deploy!') && github.event.pull_request.state == 'open')
    name: Build and push docker images
    uses: ./.github/workflows/reusable-build-and-push.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  upgrade-or-install-deployment:
    name: Upgrade or install deployment
    needs: build-and-push
    uses: ./.github/workflows/reusable-ecamp3-deployment.yml
    with:
      name: pr${{ github.event.pull_request.number }}
      sha: ${{ github.event.pull_request.head.sha }}
      env: feature-branch
      pr-number: ${{ github.event.pull_request.number }}
      dropDBOnUninstall: true
      action: ${{ github.event.inputs.action || 'deploy' }}
    secrets: inherit
