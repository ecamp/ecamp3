name: CD for feature branches

on:
  pull_request_target:
    types: [opened, reopened, labeled, synchronize]
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action'
        type: choice
        required: true
        default: diff
        options:
          - diff
          - deploy

concurrency:
  group: ${{ github.workflow}}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-write-access:
    name: Check write access permission
    runs-on: ubuntu-latest
    steps:
      - name: Check if user has write access to ecamp/ecamp3
        run: |
          set -eo pipefail

          # Determine the user to check based on event type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            USER="${{ github.actor }}"
          else
            USER="${{ github.event.pull_request.user.login }}"
          fi

          echo "Checking write access for user: $USER"

          # Query collaborators of ecamp/ecamp3; permission is on the edge
          RESULT=$(curl -s -X POST "https://api.github.com/graphql" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -d "{\"query\": \"query { repository(owner: \\\"ecamp\\\", name: \\\"ecamp3\\\") { collaborators(first: 100) { edges { node { login } permission } } } }\"}" || true)

          echo "GraphQL result: $RESULT"

          # Allow only WRITE, MAINTAIN or ADMIN permission
          HAS_ACCESS=$(echo "$RESULT" | jq -r --arg user "$USER" '.data.repository.collaborators.edges[]? | select(.node.login == $user) | .permission' | grep -E '^(WRITE|MAINTAIN|ADMIN)$' | head -1 || true)

          if [ -n "$HAS_ACCESS" ]; then
            echo "User $USER has write access (role: $HAS_ACCESS)"
          else
            echo "::error::User $USER does not have write access to ecamp/ecamp3. Required role: WRITE, MAINTAIN or ADMIN."
            exit 1
          fi

  build-and-push:
    needs: check-write-access
    if: (github.event_name == 'workflow_dispatch') || (contains(github.event.pull_request.labels.*.name, 'deploy!') && github.event.pull_request.state == 'open')
    name: Build and push docker images
    uses: ./.github/workflows/reusable-build-and-push.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  upgrade-or-install-deployment:
    name: Upgrade or install deployment
    needs: build-and-push
    uses: ./.github/workflows/reusable-ecamp3-deployment.yml
    with:
      name: pr${{ github.event.pull_request.number }}
      sha: ${{ github.event.pull_request.head.sha }}
      env: feature-branch
      pr-number: ${{ github.event.pull_request.number }}
      dropDBOnUninstall: true
      action: ${{ github.event.inputs.action || 'deploy' }}
    secrets: inherit
