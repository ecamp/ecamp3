name: CD for feature branches

on:
  pull_request_target:
    types: [opened, reopened, labeled, synchronize]
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action'
        type: choice
        required: true
        default: diff
        options:
          - diff
          - deploy

concurrency:
  group: ${{ github.workflow}}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-write-access:
    name: Check write access permission
    # Same condition as build-and-push, so pull requests that would not be
    # deployed anyway do not get a red check.
    if: (github.event_name == 'workflow_dispatch') || (contains(github.event.pull_request.labels.*.name, 'deploy!') && github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    steps:
      - name: Check if user has write access to this repository
        uses: actions/github-script@v9
        with:
          script: |
            const login = context.payload.pull_request?.user?.login ?? context.actor;
            const validLogin = typeof login === 'string' && /^[a-zA-Z0-9-]+$/.test(login);

            if (!validLogin) {
              core.setFailed('Unable to determine a valid user to authorize.');
              return;
            }

            try {
              const membership = await github.rest.orgs.checkMembershipForUser({
                org: 'ecamp',
                username: login,
              });
              const collaborator = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: login,
              });

              const activeMember = membership.status === 204;
              const permission = collaborator.status === 200 && collaborator.data && typeof collaborator.data.permission === 'string'
                ? collaborator.data.permission
                : undefined;
              const allowed = activeMember && ['write', 'maintain', 'admin'].includes(permission);

              core.info(
                `${login} has active membership=${activeMember} and permission="${permission ?? 'unknown'}" on ${context.repo.owner}/${context.repo.repo}: ${allowed ? 'allow' : 'deny'}`
              );

              if (!allowed) {
                core.setFailed(
                  `User ${login} must be an active ecamp member with write, maintain, or admin access to ${context.repo.owner}/${context.repo.repo}.`
                );
              }
            } catch (error) {
              core.setFailed(`Unable to verify access for ${login}: ${error?.message ?? 'GitHub API error'}`);
            }

  build-and-push:
    needs: check-write-access
    if: (github.event_name == 'workflow_dispatch') || (contains(github.event.pull_request.labels.*.name, 'deploy!') && github.event.pull_request.state == 'open')
    name: Build and push docker images
    uses: ./.github/workflows/reusable-build-and-push.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  upgrade-or-install-deployment:
    name: Upgrade or install deployment
    needs: build-and-push
    uses: ./.github/workflows/reusable-ecamp3-deployment.yml
    with:
      name: pr${{ github.event.pull_request.number }}
      sha: ${{ github.event.pull_request.head.sha }}
      env: feature-branch
      pr-number: ${{ github.event.pull_request.number }}
      dropDBOnUninstall: true
      action: ${{ github.event.inputs.action || 'deploy' }}
    secrets: inherit
