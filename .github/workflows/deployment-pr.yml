name: CD for feature branches

on:
  pull_request_target:
    types: [opened, reopened, labeled, synchronize]
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action'
        type: choice
        required: true
        default: diff
        options:
          - diff
          - deploy

concurrency:
  group: ${{ github.workflow}}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-write-access:
    name: Check write access permission
    runs-on: ubuntu-latest
    outputs:
      has-access: ${{ steps.check.outputs.has-access }}
    steps:
      - name: Check if user has write access to ecamp/ecamp3
        id: check
        run: |
          # Determine the user to check based on event type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            USER="${{ github.actor }}"
          else
            USER="${{ github.event.pull_request.user.login }}"
          fi
          
          echo "Checking write access for user: $USER"
          
          # Query GitHub GraphQL API to check if user is an org member with write access
          RESULT=$(curl -s -X POST "https://api.github.com/graphql" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -d "{\"query\": \"query { organization(login: \\\"ecamp\\\") { membersWithRole(first: 100, query: \\\"$USER\\\") { edges { node { login } role } } } }\"}")
          
          echo "GraphQL result: $RESULT"
          
          # Check if user is found with WRITE or ADMIN role
          HAS_ACCESS=$(echo "$RESULT" | jq -r --arg user "$USER" '.data.organization.membersWithRole.edges[] | select(.node.login == $user) | .role' | grep -E '^(WRITE|ADMIN)$' | head -1)
          
          if [ -n "$HAS_ACCESS" ]; then
            echo "User $USER has write access (role: $HAS_ACCESS)"
            echo "has-access=true" >> $GITHUB_OUTPUT
          else
            echo "User $USER does NOT have write access to ecamp/ecamp3"
            echo "has-access=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: check-write-access
    if: (needs.check-write-access.outputs.has-access == 'true') && ((github.event_name == 'workflow_dispatch') || (contains(github.event.pull_request.labels.*.name, 'deploy!') && github.event.pull_request.state == 'open'))
    name: Build and push docker images
    uses: ./.github/workflows/reusable-build-and-push.yml
    with:
      sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  upgrade-or-install-deployment:
    name: Upgrade or install deployment
    needs: build-and-push
    uses: ./.github/workflows/reusable-ecamp3-deployment.yml
    with:
      name: pr${{ github.event.pull_request.number }}
      sha: ${{ github.event.pull_request.head.sha }}
      env: feature-branch
      pr-number: ${{ github.event.pull_request.number }}
      dropDBOnUninstall: true
      action: ${{ github.event.inputs.action || 'deploy' }}
    secrets: inherit
