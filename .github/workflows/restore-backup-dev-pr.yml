name: DB Restore for dev and feature branches

on:
  workflow_dispatch:
    inputs:
      restoreSourceFile:
        type: string
        description: |
          The sourceFile of the backup in the bucket to restore, e.g.
          ecamp3-dev/2023-07-17-12-55-33-ecamp3-dev.sql.gz.gpg.
          Use "latest" for the latest backup.
        required: true
        default: latest
      pr-number:
        type: number
        description: |
          The pr number if it is a pr (3898), else null
        required: false
      env:
        type: environment
        description: The environment, if name is dev then dev, else feature-branch
        required: true
        default: dev
      action:
        description: 'Choose action'
        type: choice
        required: true
        default: diff
        options:
          - diff
          - deploy

jobs:
  check-write-access:
    name: Check write access permission
    runs-on: ubuntu-latest
    outputs:
      has-access: ${{ steps.check.outputs.has-access }}
    steps:
      - name: Check if caller has write access to ecamp/ecamp3
        id: check
        run: |
          # For workflow_dispatch, check the actor who triggered the workflow
          USER="${{ github.actor }}"
          
          echo "Checking write access for user: $USER"
          
          # Query GitHub GraphQL API to check if user is an org member with write access
          RESULT=$(curl -s -X POST "https://api.github.com/graphql" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_ACCESS_TOKEN }}" \
            -d "{\"query\": \"query { organization(login: \\\"ecamp\\\") { membersWithRole(first: 100, query: \\\"$USER\\\") { edges { node { login } role } } } }\"}")
          
          echo "GraphQL result: $RESULT"
          
          # Check if user is found with WRITE or ADMIN role
          HAS_ACCESS=$(echo "$RESULT" | jq -r --arg user "$USER" '.data.organization.membersWithRole.edges[] | select(.node.login == $user) | .role' | grep -E '^(WRITE|ADMIN)$' | head -1)
          
          if [ -n "$HAS_ACCESS" ]; then
            echo "User $USER has write access (role: $HAS_ACCESS)"
            echo "has-access=true" >> $GITHUB_OUTPUT
          else
            echo "User $USER does NOT have write access to ecamp/ecamp3"
            echo "has-access=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: check-write-access
    if: needs.check-write-access.outputs.has-access == 'true'
    name: Build and push docker images
    uses: ./.github/workflows/reusable-build-and-push.yml
    with:
      sha: ${{ github.sha }}
    secrets:
      DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}

  upgrade-or-install-deployment:
    name: Upgrade or install deployment
    needs: build-and-push
    uses: ./.github/workflows/reusable-ecamp3-deployment.yml
    with:
      name: ${{ inputs.pr-number == null && 'dev' || format('pr{0}', inputs.pr-number) }}
      sha: ${{ github.sha }}
      env: ${{ inputs.env }}
      pr-number: ${{ inputs.pr-number }}
      dropDBOnUninstall: ${{ inputs.pr-number != null }}
      restoreSourceFile: ${{ inputs.restoreSourceFile }}
      action: ${{ github.event.inputs.action }}
    secrets: inherit
