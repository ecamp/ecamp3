name: Validate write access gate

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Exercise reusable gate and both callers
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const reusable = fs.readFileSync('.github/workflows/reusable-check-write-access.yml', 'utf8')
          const deployment = fs.readFileSync('.github/workflows/deployment-pr.yml', 'utf8')
          const restore = fs.readFileSync('.github/workflows/restore-backup-dev-pr.yml', 'utf8')

          assert.match(reusable, /workflow_call:/)
          assert.match(reusable, /REPO_ACCESS_TOKEN:\n\s+required: true/)
          for (const caller of [deployment, restore]) {
            assert.match(caller, /uses: \.\/\.github\/workflows\/reusable-check-write-access\.yml/)
            assert.match(caller, /REPO_ACCESS_TOKEN: \$\{\{ secrets\.REPO_ACCESS_TOKEN \}\}/)
            assert.match(caller, /build-and-push:\n\s+needs: check-write-access/)
          }

          const conditions = [...deployment.matchAll(/^ {4}if: (.+)$/gm)].map((match) => match[1])
          assert.equal(conditions.length, 2, 'deployment-pr.yml gates two jobs')
          assert.equal(conditions[0], conditions[1], 'gate and build share the deploy condition')
          assert.match(
            conditions[0],
            /github\.event_name == 'workflow_dispatch'\).*'deploy!'.*state == 'open'/,
            'deploy condition is dispatch or an open deploy! pull request'
          )

          const match = reusable.match(/\n          script: \|\n([\s\S]*?)\n        env:/)
          assert.ok(match, 'github-script body is present')
          const script = match[1].split('\n').map((line) => line.slice(12)).join('\n')
          assert.ok(!/user\?\.login/.test(script), 'gate must not authorize the pull request author')
          assert.ok(!/checkMembershipForUser/.test(script), 'gate must not check org membership')

          const withDefaults = (input = {}) => ({
            actor: 'dispatcher',
            headRepoOwner: 'trusted-fork-owner',
            sameRepo: false,
            headRepoNull: false,
            noPullRequest: false,
            collaboratorStatus: 200,
            permission: 'write',
            token: 'token',
            apiError: undefined,
            ...input,
          })

          const run = async (i) => {
            const failures = []
            const users = []
            const github = {
              rest: {
                repos: {
                  getCollaboratorPermissionLevel: async ({ username }) => {
                    users.push(username)
                    if (i.apiError === 'permission') throw new Error('permission')
                    return { status: i.collaboratorStatus, data: { permission: i.permission } }
                  },
                },
              },
            }
            const pullRequest = i.noPullRequest
              ? undefined
              : {
                  user: { login: 'trusted-human' },
                  head: {
                    repo: i.headRepoNull
                      ? null
                      : {
                          full_name: i.sameRepo ? 'ecamp/ecamp3' : `${i.headRepoOwner}/ecamp3`,
                          owner: { login: i.headRepoOwner },
                        },
                  },
                }
            const context = {
              actor: i.actor,
              payload: pullRequest ? { pull_request: pullRequest } : {},
              repo: { owner: 'ecamp', repo: 'ecamp3' },
            }
            const core = { setFailed: (message) => failures.push(message), info: () => {} }
            await new Function(
              'github',
              'context',
              'core',
              'process',
              `return (async () => {${script}\n})()`
            )(github, context, core, { env: { REPO_ACCESS_TOKEN: i.token } })
            return { passed: failures.length === 0, user: users[0] }
          }

          // Mirrors the gate control flow: no token, no resolvable login, or the
          // same-repo fast path all return before the collaborator endpoint.
          const expectedQueriedLogin = (i) => {
            if (!i.token) return undefined
            const login = i.noPullRequest ? i.actor : i.headRepoNull ? undefined : i.headRepoOwner
            if (!/^[a-zA-Z0-9-]+$/.test(login ?? '')) return undefined
            if (!i.noPullRequest && i.sameRepo) return undefined
            return login
          }

          ;(async () => {
            const cases = [
              ['same-repo branch', { sameRepo: true, headRepoOwner: 'ecamp' }, true],
              ['fork owner write', { headRepoOwner: 'acme', permission: 'write' }, true],
              ['fork owner maintain', { headRepoOwner: 'acme', permission: 'maintain' }, true],
              ['fork owner admin', { headRepoOwner: 'acme', permission: 'admin' }, true],
              ['fork owner read', { headRepoOwner: 'acme', permission: 'read' }, false],
              ['fork owner triage', { headRepoOwner: 'acme', permission: 'triage' }, false],
              ['agent fork owner read', { headRepoOwner: 'agent-fork-bot', permission: 'read' }, false],
              ['agent fork owner write', { headRepoOwner: 'agent-fork-bot', permission: 'write' }, true],
              ['collaborator not 200', { headRepoOwner: 'acme', collaboratorStatus: 404 }, false],
              ['deleted fork', { headRepoOwner: 'acme', headRepoNull: true }, false],
              ['malformed head owner', { headRepoOwner: 'bad owner!' }, false],
              ['dispatch write actor', { noPullRequest: true, actor: 'maintainer' }, true],
              ['dispatch malformed actor', { noPullRequest: true, actor: 'bad actor!' }, false],
              ['empty token', { headRepoOwner: 'acme', token: '' }, false],
              ['collaborator api throw', { headRepoOwner: 'acme', apiError: 'permission' }, false],
            ]

            for (const [label, input, expected] of cases) {
              const i = withDefaults(input)
              const result = await run(i)
              assert.equal(result.passed, expected, label)
              assert.equal(result.user, expectedQueriedLogin(i), `${label}: queried login`)
              if (!i.noPullRequest) {
                assert.notEqual(
                  result.user,
                  'trusted-human',
                  `${label}: the pull request author must never be authorized`
                )
              }
              console.log(`${expected ? 'allow' : 'deny '} ${label} (queried ${result.user ?? 'nothing'})`)
            }
            console.log('reusable gate matrix and both caller wiring passed')
          })().catch((error) => { console.error(error); process.exitCode = 1 })
          NODE
