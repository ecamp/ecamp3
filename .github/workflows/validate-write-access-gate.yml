name: Validate write access gate

on:
  push:
    paths:
      - .github/workflows/deployment-pr.yml
      - .github/workflows/reusable-check-write-access.yml
      - .github/workflows/restore-backup-dev-pr.yml
      - .github/workflows/validate-write-access-gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Exercise reusable gate against the 16-case matrix
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const reusable = fs.readFileSync('.github/workflows/reusable-check-write-access.yml', 'utf8')
          const deployment = fs.readFileSync('.github/workflows/deployment-pr.yml', 'utf8')
          const restore = fs.readFileSync('.github/workflows/restore-backup-dev-pr.yml', 'utf8')

          assert.match(reusable, /workflow_call:/)
          assert.match(reusable, /REPO_ACCESS_TOKEN:\n\s+required: true/)
          assert.doesNotMatch(reusable, /checkMembershipForUser|orgs\./, 'gate must not use organization membership')
          assert.match(reusable, /\['write', 'maintain', 'admin'\]\.includes\(permission\)/, 'allow-list is write, maintain, admin')
          for (const caller of [deployment, restore]) {
            assert.match(caller, /uses: \.\/\.github\/workflows\/reusable-check-write-access\.yml/)
            assert.match(caller, /REPO_ACCESS_TOKEN: \$\{\{ secrets\.REPO_ACCESS_TOKEN \}\}/)
            assert.match(caller, /build-and-push:\n\s+needs: check-write-access/)
          }
          const conditionOf = (workflow, job) => workflow.match(new RegExp(`${job}:\\n[\\s\\S]*?\\n\\s+if: (.+)\\n`))[1]
          assert.equal(
            conditionOf(deployment, 'check-write-access'),
            conditionOf(deployment, 'build-and-push'),
            'the gate must cover the same condition as the deployment it guards'
          )

          const match = reusable.match(/\n          script: \|\n([\s\S]*?)\n        env:/)
          assert.ok(match, 'github-script body is present')
          const script = match[1].split('\n').map((line) => line.slice(12)).join('\n')
          const execute = new Function('github', 'context', 'core', 'process', `return (async () => {${script}\n})()`)

          const ecamp = { id: 1403477 }
          const fork = { id: 1360608096 }
          const repo = (id, owner, type = 'User', full_name = `${owner}/ecamp3`) => ({ id, full_name, owner: { login: owner, type } })
          const pr = (head, base = ecamp, author = 'contributor') => ({ pull_request: { user: { login: author }, head: { repo: head }, base: { repo: base } } })

          const run = async ({ actor = 'dispatcher', payload = {}, permission = 'write', status = 200, token = 'token', apiError } = {}) => {
            const failures = []
            const messages = []
            const queried = []
            const github = { rest: { repos: { getCollaboratorPermissionLevel: async ({ owner, repo, username }) => { queried.push({ username, target: `${owner}/${repo}` }); if (apiError) throw new Error(apiError); return { status, data: { permission: typeof permission === 'string' ? permission : permission[username] } } } } } }
            const context = { actor, payload, repo: { owner: 'ecamp', repo: 'ecamp3' } }
            const core = { setFailed: (message) => failures.push(message), info: (message) => messages.push(message) }
            await execute(github, context, core, { env: { REPO_ACCESS_TOKEN: token } })
            return { passed: failures.length === 0, queried: queried[0]?.username, target: queried[0]?.target, messages: [...failures, ...messages] }
          }

          // 16 rows; a row may hold several shapes that must share one expectation.
          // Every expectation is about the account that OWNS the branch repository.
          const cases = [
            ['same-repository pull request is allowed without an API call',
              [{ payload: pr(repo(ecamp.id, 'ecamp')) }], [true], [undefined]],
            ['same-repository pull request authored by renovate[bot] is allowed',
              [{ payload: pr(repo(ecamp.id, 'ecamp'), ecamp, 'renovate[bot]') }], [true], [undefined]],
            ['fork whose owner has write access is allowed',
              [{ payload: pr(repo(fork.id, 'maintainer')), permission: 'write' }], [true], ['maintainer']],
            ['fork whose owner has admin access is allowed',
              [{ payload: pr(repo(fork.id, 'admin-user')), permission: 'admin' }], [true], ['admin-user']],
            ['fork whose owner has maintain access is allowed',
              [{ payload: pr(repo(fork.id, 'maintainer')), permission: 'maintain' }], [true], ['maintainer']],
            ['fork whose owner only has read access is denied',
              [{ payload: pr(repo(fork.id, 'reader')), permission: 'read' }], [false], ['reader']],
            ['fork whose owner is no collaborator is denied',
              [{ payload: pr(repo(fork.id, 'stranger')), permission: 'none' }], [false], ['stranger']],
            ['agent-controlled fork is denied even when the pull request author has write access',
              [{ payload: pr(repo(fork.id, 'bacluc-agent'), ecamp, 'maintainer'), permission: { maintainer: 'write', 'bacluc-agent': 'none' } }], [false], ['bacluc-agent']],
            ['fork is allowed on the owner write access, never on the pull request author access',
              [{ payload: pr(repo(fork.id, 'maintainer'), ecamp, 'stranger'), permission: { maintainer: 'write', stranger: 'none' } }], [true], ['maintainer']],
            ['fork owned by the ecamp organization is allowed',
              [{ payload: pr(repo(fork.id, 'ecamp', 'Organization')), permission: 'write' }], [true], ['ecamp']],
            ['fork that forges full_name of the base repository is denied, only the numeric id counts',
              [{ payload: pr(repo(fork.id, 'bacluc-agent', 'User', 'ecamp/ecamp3')), permission: 'none' }], [false], ['bacluc-agent']],
            ['deleted fork with head.repo null is denied without throwing',
              [{ payload: pr(null), permission: 'write' }], [false], [undefined]],
            ['deleted repository payload with head and base repository null is denied without throwing',
              [{ payload: { pull_request: { user: { login: 'contributor' }, head: null, base: { repo: null } } }, permission: 'write' },
                { payload: { pull_request: { head: { repo: { owner: { login: 'fork-owner' } } }, base: { repo: { owner: { login: 'ecamp' } } } } }, permission: 'write' }],
              [false, false], [undefined, undefined]],
            ['workflow_dispatch without a pull request authorizes context.actor',
              [{ actor: 'maintainer', permission: 'write' }], [true], ['maintainer']],
            ['a missing token is denied',
              [{ token: '' }], [false], [undefined]],
            ['an unusable account, a non-success status and an API error all fail closed',
              [{ payload: pr(repo(fork.id, 'bad login!')) }, { payload: pr(repo(fork.id, '')) }, { payload: pr(repo(fork.id, 'stranger')), status: 404 }, { payload: pr(repo(fork.id, 'stranger')), apiError: 'Internal Server Error' }],
              [false, false, false, false], [undefined, undefined, 'stranger', 'stranger']],
          ]
          assert.equal(cases.length, 16, 'matrix has 16 rows')

          ;(async () => {
            for (const [name, inputs, expected, queried] of cases) {
              for (const [index, input] of inputs.entries()) {
                const result = await run(input)
                const label = `${name} [shape ${index}]`
                assert.equal(result.passed, expected[index], `${label}: expected ${expected[index] ? 'allow' : 'deny'}`)
                assert.equal(result.queried, queried[index], `${label}: authorized the wrong account`)
                assert.equal(result.target, queried[index] && 'ecamp/ecamp3', `${label}: checked the wrong repository`)
                assert.ok(result.messages.length > 0, `${label}: logged nothing`)
                for (const message of result.messages) {
                  assert.doesNotMatch(message, /member/i, `${label}: still talks about membership: ${message}`)
                }
              }
            }
            console.log(`reusable gate matrix (${cases.length} cases) and both caller wiring passed`)
          })().catch((error) => { console.error(error); process.exitCode = 1 })
          NODE
