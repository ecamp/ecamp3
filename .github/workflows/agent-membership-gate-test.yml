name: Agent membership gate test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const assert = require('node:assert/strict');
            const authorize = async (membership, collaborator) => {
              try {
                const membershipResponse = await membership();
                const collaboratorResponse = await collaborator();
                const activeMember = membershipResponse.status === 204;
                const permission = collaboratorResponse.status === 200 && collaboratorResponse.data && typeof collaboratorResponse.data.permission === 'string'
                  ? collaboratorResponse.data.permission
                  : undefined;
                return activeMember && ['write', 'maintain', 'admin'].includes(permission);
              } catch {
                return false;
              }
            };

            assert.equal(await authorize(
              async () => ({ status: 204 }),
              async () => ({ status: 200, data: { permission: 'maintain' } }),
            ), true);
            assert.equal(await authorize(
              async () => ({ status: 404 }),
              async () => ({ status: 200, data: { permission: 'admin' } }),
            ), false);
            assert.equal(await authorize(
              async () => { throw new Error('membership API failure'); },
              async () => ({ status: 200, data: { permission: 'admin' } }),
            ), false);
