name: Agent membership gate test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const assert = require('node:assert/strict');
            const { execFileSync } = require('node:child_process');
            const files = ['deployment-pr.yml', 'restore-backup-dev-pr.yml'];
            const readWorkflow = async (file) => Buffer.from((await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: `.github/workflows/${file}`,
              ref: context.sha,
            })).data.content, 'base64').toString();
            const parseWorkflow = (source) => JSON.parse(execFileSync('ruby', ['-e', "require 'yaml'; require 'json'; puts JSON.generate(YAML.safe_load(STDIN.read, aliases: true))"], { input: source }));
            const runScript = async (script, { actor, pullRequestLogin, token = 'token', membershipStatus = 204, permission = 'write', failure }) => {
              const failures = [];
              const calls = { membership: 0, collaborator: 0 };
              const fail = (name) => { if (failure === name) throw new Error(`${name} API failure`); };
              const fakeGithub = { rest: { orgs: { checkMembershipForUser: async () => { calls.membership++; fail('membership'); return { status: membershipStatus }; } }, repos: { getCollaboratorPermissionLevel: async () => { calls.collaborator++; fail('permission'); return { status: 200, data: permission === undefined ? {} : { permission } }; } } } };
              const fakeContext = { actor, repo: { owner: 'ecamp', repo: 'ecamp3' }, payload: pullRequestLogin === undefined ? {} : { pull_request: { user: { login: pullRequestLogin } } } };
              const fakeCore = { info() {}, setFailed(message) { failures.push(message); } };
              const fakeProcess = { env: { REPO_ACCESS_TOKEN: token } };
              await new Function('github', 'context', 'core', 'process', `return (async () => { ${script} })()`)(fakeGithub, fakeContext, fakeCore, fakeProcess);
              return { failures, calls };
            };
            for (const file of files) {
              const source = await readWorkflow(file);
              const workflow = parseWorkflow(source);
              const gate = workflow.jobs['check-write-access'];
              const build = workflow.jobs['build-and-push'];
              const deploy = workflow.jobs['upgrade-or-install-deployment'];
              assert.equal(gate.steps.find((step) => step.name === 'Check if user has write access to this repository').uses, 'actions/github-script@v9');
              assert.equal(build.needs, 'check-write-access');
              assert.equal(deploy.needs, 'build-and-push');
              const script = gate.steps.find((step) => step.with?.script).with.script;
              assert.match(script, /checkMembershipForUser/);
              assert.match(script, /getCollaboratorPermissionLevel/);
              const cases = [
                [{ actor: 'dispatcher', pullRequestLogin: file === 'deployment-pr.yml' ? 'author' : undefined }, true],
                [{ actor: 'dispatcher', pullRequestLogin: 'member', permission: 'maintain' }, true],
                [{ actor: 'dispatcher', pullRequestLogin: 'member', permission: 'admin' }, true],
                [{ actor: 'dispatcher', pullRequestLogin: 'outsider', membershipStatus: 404 }, false],
                ...['read', 'triage', null].map((permission) => [{ actor: 'dispatcher', pullRequestLogin: 'member', permission }, false]),
                [{ actor: 'dispatcher', pullRequestLogin: 'member', token: '' }, false],
                [{ actor: file === 'restore-backup-dev-pr.yml' ? 'bad/login' : 'dispatcher', pullRequestLogin: file === 'restore-backup-dev-pr.yml' ? undefined : 'bad/login' }, false],
                [{ actor: 'dispatcher', pullRequestLogin: 'member', failure: 'membership' }, false],
                [{ actor: 'dispatcher', pullRequestLogin: 'member', failure: 'permission' }, false],
              ];
              for (const [input, allowed] of cases) assert.equal((await runScript(script, input)).failures.length === 0, allowed, `${file}: ${JSON.stringify(input)}`);
            }
