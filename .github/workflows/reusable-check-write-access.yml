name: Check write access

on:
  workflow_call:
    secrets:
      REPO_ACCESS_TOKEN:
        required: true

jobs:
  check-write-access:
    name: Check write access permission
    runs-on: ubuntu-latest
    steps:
      - name: Check if the branch repository owner has write access to this repository
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.REPO_ACCESS_TOKEN }}
          script: |
            if (!process.env.REPO_ACCESS_TOKEN) {
              core.setFailed('REPO_ACCESS_TOKEN is required to check repository write access.')
              return
            }

            const pr = context.payload.pull_request
            const headRepo = pr?.head?.repo
            const login = pr ? headRepo?.owner?.login : context.actor
            const baseOwner = context.repo.owner
            const baseRepo = context.repo.repo

            if (!/^[a-zA-Z0-9-]+$/.test(login ?? '')) {
              core.setFailed(
                `The owner of the branch repository is unknown or invalid (${login ?? 'none'}).`
              )
              return
            }

            if (headRepo?.full_name === `${baseOwner}/${baseRepo}`) {
              core.info(
                `${login} branches from ${baseOwner}/${baseRepo} itself, no access check needed.`
              )
              return
            }

            try {
              const { status, data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: baseOwner,
                repo: baseRepo,
                username: login,
              })
              const permission = status === 200 ? data?.permission : undefined
              const allowed = ['write', 'maintain', 'admin'].includes(permission)

              core.info(
                `${login} has "${permission ?? 'no access'}" on ${baseOwner}/${baseRepo}: ${
                  allowed ? 'allow' : 'deny'
                }`
              )

              if (!allowed) {
                core.setFailed(
                  `The owner of the branch repository must have write, maintain or admin access to ${baseOwner}/${baseRepo}.`
                )
              }
            } catch (error) {
              core.setFailed(
                `Could not check the access of ${login}: ${error?.message ?? 'GitHub API error'}`
              )
            }
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
